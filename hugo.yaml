baseURL: "https://tota1099.github.io/"
title: "Renan Porto Blog"

# robots.txt (layouts/robots.txt) e data de atualização dos posts via último commit
enableRobotsTXT: true
enableGitInfo: true

# Português na raiz (/), inglês em /en/. Tradução = mesmo arquivo com sufixo .en.md
defaultContentLanguage: "pt"
languages:
  pt:
    locale: "pt-BR"
    label: "Português"
    weight: 1
  en:
    locale: "en-US"
    label: "English"
    weight: 2

module:
  imports:
    - path: github.com/imfing/hextra

# URLs com data, como /2026/09/25/titulo-do-post/
permalinks:
  blog: "/:year/:month/:day/:slug/"

menu:
  main:
    # nomes traduzidos em i18n/<idioma>.yaml pelo identifier
    - identifier: menuAbout
      name: Sobre
      pageRef: /about
      weight: 1
    - identifier: menuBlog
      name: Arquivo
      pageRef: /blog
      weight: 2
    - name: Busca
      weight: 3
      params:
        type: search
    - name: Idioma
      weight: 4
      params:
        type: language-switch
    - name: Tema
      weight: 5
      params:
        type: theme-toggle
    - name: GitHub
      weight: 6
      url: "https://github.com/tota1099"
      params:
        icon: github
    - name: LinkedIn
      weight: 7
      url: "https://www.linkedin.com/in/renan-de-medeiros-porto"
      params:
        icon: linkedin

params:
  googleSiteVerification: F0gPxk7jaER00rHp4uv71mAa3m-TlHhhLGMoW9tpgMg
  description: "Blog do Renan Porto, Tech Lead e Engenheiro de Software. Tecnologia, finanças e estilo de vida."
  # imagem padrão ao compartilhar links (quando o post não define images)
  images:
    - /photo.jpg
  navbar:
    displayTitle: true
    logo:
      path: images/logo.svg
      width: 22
      height: 22
  footer:
    displayPoweredBy: false
    displayCopyright: true
  theme:
    default: system
    displayToggle: true
  blog:
    list:
      displayTags: true
  # Comentários via giscus (GitHub Discussions).
  # As versões pt/en de um post compartilham a mesma discussão:
  # ver layouts/_partials/components/giscus.html
  comments:
    enable: true
    type: giscus
    giscus:
      repo: tota1099/tota1099.github.io
      repoId: R_kgDOUrSSVg
      category: Announcements
      categoryId: DIC_kwDOUrSSVs4DG9Zx
      strict: 1
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom
# posts antigos usam HTML (tabelas) dentro do markdown
markup:
  goldmark:
    renderer:
      unsafe: true
